[package]
name = "echo-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"

[dependencies]
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
log = "0.4"
pretty_env_logger = "0.5"
